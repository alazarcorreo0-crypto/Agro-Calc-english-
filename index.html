<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clon de Mapa Personalizado - AgroMix</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #header {
            padding: 12px;
            text-align: center;
            background-color: #1e1e1e;
            border-bottom: 2px solid #00e676;
        }
        h1 {
            margin: 0;
            font-size: 18px;
            color: #ffffff;
            letter-spacing: 1px;
        }
        #map {
            width: 100vw;
            height: calc(100vh - 48px);
        }

        /* DISEÑO DEL RECUADRO ESTILO AGROMIX */
        .leaflet-popup-content-wrapper {
            background: #1a1a1a !important;
            color: #ffffff !important;
            border: 2px solid #00e676; /* Borde verde neón personalizado */
            border-radius: 10px;
            padding: 4px;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
            border: 1px solid #00e676;
        }
        .popup-title {
            font-size: 16px;
            font-weight: bold;
            color: #00e676;
            margin-bottom: 4px;
        }
        .popup-text {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 10px;
        }
        .popup-btn {
            width: 100%;
            padding: 8px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="header">
    <h1>ING. MACIAS • FIELD MAP (CUSTOM)</h1>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>

<script>
    // 1. Centrar el mapa en las coordenadas de tus lotes
    const map = L.map('map').setView([45.741711799137974, -119.82943168453367], 13);

    // 2. Capa base de satélite limpia
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

    // 3. Jalar la capa de información original pero CAMBIANDO LOS COLORES des de el código
    L.esri.featureLayer({
        url: 'https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/World_Imagery/FeatureServer/0',
        
        // AQUÍ PASA LA MAGIA: Customizamos el diseño de los lotes de ArcGIS
        style: function (feature) {
            return {
                color: '#00e676',       // Cambié el borde a un Verde Neón brillante
                weight: 2.5,            // Grosor de la línea divisoria
                fillColor: '#00796b',   // Color de fondo de los círculos (Verde azulado)
                fillOpacity: 0.25       // Opacidad para alcanzar a ver el cultivo abajo
            };
        }
    }).addTo(map).on('click', function(e) {
        
        // Jalamos los atributos originales de la base de datos de tu mapa
        const props = e.layer.feature.properties;
        
        // Extraemos dinámicamente el Lote y los Acres tal como vienen en tu ArcGIS
        const loteNum = props.FieldName || props.name || props.Name || props.Lote || "N/A";
        const acresNum = props.Acres || props.acres || props.Area || props.calc_acres || "0.00";

        // Diseñamos el recuadro con nuestro nuevo estilo
        let popupContent = `
            <div style="min-width: 150px;">
                <div class="popup-title">Lote ${loteNum}</div>
                <div class="popup-text">Tamaño: <b>${acresNum} ac</b></div>
                <button class="popup-btn" onclick="guardarDato('${loteNum}', '${acresNum}')">Save to History</button>
            </div>
        `;

        L.popup()
            .setLatLng(e.latlng)
            .setContent(popupContent)
            .openOn(map);
    });

    function guardarDato(lote, acres) {
        alert("Enviando " + acres + " acres del Lote " + lote + " a la mezcla de AgroMix.");
    }
</script>

</body>
</html>
