<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Mapa - AgroMix</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #header {
            padding: 12px;
            text-align: center;
            background-color: #1e1e1e;
            border-bottom: 2px solid #2e7d32;
        }
        h1 {
            margin: 0;
            font-size: 20px;
            color: #ff9800;
        }
        #map {
            width: 100vw;
            height: calc(100vh - 50px);
        }

        /* ======================================================= */
        /* DISEÑO PERSONALIZADO DEL POPUP (ESTILO RECUADRO NEGRO)  */
        /* ======================================================= */
        .leaflet-popup-content-wrapper {
            background: #1e1e1e !important;
            color: #ffffff !important;
            border: 2px solid #333333;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            padding: 6px;
        }
        .leaflet-popup-tip {
            background: #1e1e1e !important;
            border: 1px solid #333333;
        }
        .popup-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .popup-acres {
            font-size: 14px;
            color: #b0bec5;
            margin-bottom: 12px;
        }
        .popup-btn {
            width: 100%;
            padding: 10px;
            background-color: #e0e0e0;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
        }
        .popup-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div id="header">
    <h1>🚜 AGROMIX • FIELD MAP</h1>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>

<script>
    // 1. Inicializar el mapa centrado en tus coordenadas reales de Hermiston
    const map = L.map('map').setView([45.741711799137974, -119.82943168453367], 13);

    // 2. Capa base de satélite oficial de Esri
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Esri &mdash; Satellite Community Maps'
    }).addTo(map);

    // 3. Cargar las líneas e interacción de tus pivotes desde tu servidor de ArcGIS
    L.esri.featureLayer({
        url: 'https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/World_Imagery/FeatureServer/0',
        style: function () {
            return {
                color: '#4caf50',       // Orillas verdes como en tu ArcGIS Field Maps original
                weight: 2,
                fillColor: '#2e7d32',
                fillOpacity: 0.15       // Transparencia ligera sobre el círculo de riego
            };
        }
    }).addTo(map).on('click', function(e) {
        // Al hacer clic, extraemos las columnas de la base de datos de ArcGIS
        const props = e.layer.feature.properties;
        
        // Buscamos dinámicamente cómo se llaman tus columnas (Lote / Acres)
        const nombreLote = props.FieldName || props.name || props.Name || props.Lote || "Desconocido";
        const acresLote = props.Acres || props.acres || props.Area || props.calc_acres || "0.00";

        // Estructuramos el contenido interactivo con el botón "Save to History"
        let popupContent = `
            <div style="min-width: 160px; text-align: left;">
                <div class="popup-title">Lote ${nombreLote}</div>
                <div class="popup-acres">Acres: ${acresLote}</div>
                <button class="popup-btn" onclick="seleccionarLote('${nombreLote}', '${acresLote}')">Save to History</button>
            </div>
        `;

        L.popup()
            .setLatLng(e.latlng)
            .setContent(popupContent)
            .openOn(map);
    });

    // 5. Función que se activa al presionar el botón del recuadro
    function seleccionarLote(nombre, acres) {
        // Por ahora, como es tu repositorio de pruebas, te lanzará una alerta confirmando los datos.
        // Cuando unamos esto a tu AgroMix principal, en lugar de una alerta, este botón
        // va a inyectar el valor de los acres directo en la calculadora y te abrirá la pestaña de mezcla.
        alert("Lote seleccionado: " + nombre + "\nAcres enviados: " + acres + " ac");
    }
</script>

</body>
</html>
