<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Custom Fields - AgroMix</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #header {
            padding: 12px;
            text-align: center;
            background-color: #1e1e1e;
            border-bottom: 2px solid #4caf50;
        }
        h1 {
            margin: 0;
            font-size: 18px;
            color: #ffffff;
            letter-spacing: 1px;
        }
        #map {
            width: 100vw;
            height: calc(100vh - 48px);
        }

        /* DISEÑO OSCURO PERSONALIZADO PARA EL POPUP DE LOS PIVOTES */
        .leaflet-popup-content-wrapper {
            background: #1a1a1a !important;
            color: #ffffff !important;
            border: 2px solid #4caf50; /* Borde verde para hacer juego */
            border-radius: 10px;
            padding: 4px;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
            border: 1px solid #4caf50;
        }
        .popup-title {
            font-size: 16px;
            font-weight: bold;
            color: #4caf50;
            margin-bottom: 4px;
        }
        .popup-text {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 10px;
        }
        .popup-btn {
            width: 100%;
            padding: 8px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="header">
    <h1>ING. MACIAS • AGROMIX FIELDS</h1>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>

<script>
    // 1. Inicializar el mapa centrado en la zona de tus pivotes en Hermiston
    const map = L.map('map').setView([45.741711799137974, -119.82943168453367], 13);

    // 2. Capa base satelital oficial de Esri (World Imagery)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

    // 3. Jalar la capa original "Fields (Searchable)" usando el ID público de tu mapa
    // El script busca el FeatureServer del mapa ab094c965221405ebd4d59345e7ec3df
    L.esri.featureLayer({
        url: 'https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/World_Imagery/FeatureServer/0',
        
        // AQUÍ AJUSTAS LOS COLORES Y ESTILOS DE TUS CÍRCULOS DESDE EL CÓDIGO
        style: function (feature) {
            return {
                color: '#2cba00',       // Borde verde brillante personalizado
                weight: 2,              // Grosor de la línea del círculo
                fillColor: '#a3ff73',   // Color de relleno de las parcelas
                fillOpacity: 0.25       // Opacidad para no tapar el cultivo de abajo
            };
        }
    }).addTo(map).on('click', function(e) {
        
        // Extraemos las propiedades y columnas originales de tu base de datos de ArcGIS
        const props = e.layer.feature.properties;
        
        // Buscamos las columnas que coincidan con tus etiquetas (Nombre del pivote y su tamaño)
        const loteNum = props.FieldName || props.name || props.Name || props.Lote || "N/A";
        const acresNum = props.Acres || props.acres || props.Area || props.calc_acres || "0.00";

        // Armamos el recuadro negro con el nuevo diseño y el botón interactivo
        let popupContent = `
            <div style="min-width: 150px; text-align: left;">
                <div class="popup-title">Lote ${loteNum}</div>
                <div class="popup-text">Tamaño: <b>${acresNum} ac</b></div>
                <button class="popup-btn" onclick="inyectarDato('${loteNum}', '${acresNum}')">Save to History</button>
            </div>
        `;

        L.popup()
            .setLatLng(e.latlng)
            .setContent(popupContent)
            .openOn(map);
    });

    // Función de prueba para simular el envío de datos a la calculadora
    function inyectarDato(lote, acres) {
        alert("Pivote seleccionado: Lote " + lote + "\n" + acres + " acres enviados listos para calcular mezcla.");
    }
</script>

</body>
</html>
