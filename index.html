<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Mapa - AgroMix</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #header {
            padding: 12px;
            text-align: center;
            background-color: #1e1e1e;
            border-bottom: 2px solid #2e7d32;
        }
        h1 {
            margin: 0;
            font-size: 20px;
            color: #ff9800;
        }
        #map {
            width: 100vw;
            height: calc(100vh - 50px);
        }
        .leaflet-popup-content-wrapper {
            background: #1e1e1e !important;
            color: #fff !important;
            border: 1px solid #333;
        }
        .leaflet-popup-tip {
            background: #1e1e1e !important;
        }
    </style>
</head>
<body>

<div id="header">
    <h1>🚜 AGROMIX • MAP TEST</h1>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>

<script>
    // 1. Inicializar el mapa centrado en tus coordenadas de Hermiston / Umatilla County
    const map = L.map('map').setView([45.741711799137974, -119.82943168453367], 13);

    // 2. Mapa base satelital de Esri para que puedas ver los círculos y los pivotes reales del terreno
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    }).addTo(map);

    // 3. Conectar el mapa público mediante el servicio web de ArcGIS Online
    // Este conector lee directamente las figuras de los lotes sobre el satélite
    L.esri.mapService({
        url: 'https://tiles.arcgis.com/tiles/P3ePLMYs2RVChkJx/arcgis/rest/services/World_Imagery/MapServer'
    }).addTo(map);

    // 4. Agregar la capa de los polígonos interactivos (para poder hacer clic en las parcelas)
    L.esri.featureLayer({
        url: 'https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/World_Imagery/FeatureServer/0',
        style: function () {
            return {
                color: '#ff9800',       // Orillas de tus lotes en color naranja para que resalten sobre el satélite
                weight: 2,              // Grosor de la línea
                fillColor: '#ff9800',   // Color de relleno
                fillOpacity: 0.1        // Transparencia del lote
            };
        }
    }).addTo(map).on('click', function(e) {
        const props = e.layer.feature.properties;
        
        let popupText = "<div style='font-size:14px; padding: 5px;'>";
        popupText += "<b style='color:#ff9800;'>🌾 Lote Detectado</b><br><br>";
        
        // Imprime todas las propiedades disponibles en la consola para saber qué nombres tienen tus columnas
        console.log("Datos del lote clicado:", props);

        // Muestra los datos dinámicos que tenga el mapa público
        if (props.FieldName || props.name || props.Name || props.Lote) {
            popupText += "<b>Nombre:</b> " + (props.FieldName || props.name || props.Name || props.Lote) + "<br>";
        }
        if (props.Acres || props.acres || props.Area || props.calc_acres) {
            popupText += "<b>Acres:</b> <span style='color:#ffeb3b; font-weight:bold;'>" + (props.Acres || props.acres || props.Area || props.calc_acres) + " ac</span><br>";
        } else {
            popupText += "<span style='color:#aaa; font-size:11px;'>Polígono cargado correctamente.</span>";
        }
        popupText += "</div>";

        L.popup()
            .setLatLng(e.latlng)
            .setContent(popupText)
            .openOn(map);
    });
</script>

</body>
</html>
